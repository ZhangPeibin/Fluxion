# Public, repeatable benchmark profile; credentials are supplied through .env.
host: 127.0.0.1
port: 8081
enabled_platforms: [uniswap-v2, uniswap-v3, curve, shibaswap-v2]
protocol_conversions:
  - kind: wsteth
    contract: "0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0"
    underlying: "0xae7ab96520de3a18e5e111b5eaab095312d7fe84"
    wrapped: "0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0"
    wrap: true
    unwrap: true
max_pools: 10000
min_liquidity: 50000
max_hops: 3
top_k: 8
reserve_ratio_k: 0
refresh_interval_secs: 30
snapshot_refresh_secs: 120
request_timeout_ms: 10000
token_allowlist: [] # Built-in major-token universe; both/all coins must match.
