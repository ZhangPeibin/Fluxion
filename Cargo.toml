[workspace]
members = ["crates/protocol", "crates/remote", "crates/client"]

[package]
name = "fluxion"
version = "0.1.0"
edition = "2024"
description = "Web3 agent capability runtime for exact-in swap quotes via CLI and MCP"
repository = "https://github.com/ZhangPeibin/Fluxion"
readme = "README.md"

[dependencies]
fluxion-protocol = { path = "crates/protocol" }
fluxion-remote = { path = "crates/remote" }
fluxion-client = { path = "crates/client" }

[dev-dependencies]
alloy-primitives = { version = "1.7.3", features = ["serde"] }
async-trait = "0.1.92"
axum = "0.8.9"
dotenvy = "0.15.7"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha3 = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync", "io-util", "io-std", "process"] }
tower = { version = "0.5.3", features = ["util"] }
