[package]
name = "fluxion"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1.7.3"
async-trait = "0.1.92"
axum = "0.8.9"
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
sha3 = "0.12.0"
tower = { version = "0.5.3", features = ["util"] }
