# Local Fluxion runtime for server development and future wallet/execute capabilities.
# Production `swap.quote` uses the remote Fluxion service, not this profile.
# Start explicitly: FLUXION_REQUIRE_AUTH=1 cargo run -p fluxion-remote --release -- serve --config configs/runtime.yaml
# Local clients then point at it:
#   FLUXION_REMOTE_URL=http://127.0.0.1:8080 fluxion mcp
# `fluxion mcp` never starts or waits for this server.
host: 127.0.0.1
port: 8080
enabled_platforms: [uniswap-v2, uniswap-v3, sushi-v3, pancake-v3, curve, shibaswap-v2]
max_pools: 10000
min_liquidity: 10000
max_hops: 3
top_k: 8
reserve_ratio_k: 0
request_timeout_ms: 10000
token_allowlist: []
excluded_pools:
  # Legacy Tricrypto only; Tricrypto2 with identical coins remains enabled.
  - "0x80466c64868e1ab14a1ddf27a676c3fcbe638fe5"
pricing_mode: local_snapshot
# Refresh the discovered universe periodically while serving.
universe_refresh_secs: 300
v3_deployments:
  - venue: sushi-v3
    factory: "0xbACEB8eC6b9355Dfc0269C18bac9d6E2Bdc29C4F"
    quoter: "0x64e8802fe490fa7cc61d3463958199161bb608a7"
    deployment_id: "QmP1FMFsU4wNcui1eezwuvBjxrbLPucKrKZ9Kftn34nULw"
  - venue: pancake-v3
    factory: "0x0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865"
    quoter: "0xB048Bbc1Ee6b733FFfCFb9e9CeF7375518e25997"
    subgraph_id: "CJYGNhb7RvnhfBDjqpRnD3oxgyhibzc7fkAMa38YV3oS"
split:
  max_branches: 8
  max_quote_calls: 4096
local_state:
  sync_timeout_ms: 300000
  batch_size: 400
  max_age_secs: 60
  max_lag_blocks: 3
  v3_bitmap_radius: 16
  v3_full_range: true
  v3_max_loaded_ticks: 250000
  sync_mode: incremental
  poll_interval_ms: 1000
  full_reload_interval_secs: 900
  max_incremental_gap_blocks: 64
  v3_log_chunk_blocks: 5000
