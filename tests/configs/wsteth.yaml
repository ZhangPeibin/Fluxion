# #32: local conversion + V3 multi-hop example, not the full 90-row profile.
# Requires GRAPH_API_KEY in .env for Uniswap discovery. For conversion-only
# operation without a Graph key, set enabled_platforms: [].
host: 127.0.0.1
port: 8085
pricing_mode: local_snapshot
enabled_platforms: [uniswap-v3]
min_liquidity: 1000000 # explicit restricted universe, not a full-coverage claim
protocol_conversions:
  - kind: wsteth
    contract: "0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0"
    underlying: "0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84"
    wrapped: "0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0"
    enabled: true
    wrap: true
    unwrap: true
token_allowlist:
  - "0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84" # stETH
  - "0x7f39C581F595B53c5cb19bD0b3f8dA6c935E2Ca0" # wstETH
  - "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2" # WETH
  - "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48" # USDC
local_state:
  poll_interval_ms: 2000
  sync_timeout_ms: 30000
  batch_size: 200
  max_age_secs: 60
  max_lag_blocks: 3
  v3_bitmap_radius: 2
  v3_max_loaded_ticks: 50000
  compute_concurrency: 4
