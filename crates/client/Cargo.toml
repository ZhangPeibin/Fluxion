[package]
name = "fluxion-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fluxion"
path = "src/main.rs"

[dependencies]
fluxion-protocol = { path = "../protocol" }
alloy-primitives = { version = "1.7.3", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "sync", "io-util", "io-std", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
data-encoding = "2"
bs58 = "0.5"
rand = "0.8"
url = "2"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
axum = "0.8.9"
futures = "0.3.34"
serde_json = "1.0.154"
