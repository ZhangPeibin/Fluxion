[package]
name = "fluxion-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1.7.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
time = { version = "0.3.55", features = ["formatting"] }

