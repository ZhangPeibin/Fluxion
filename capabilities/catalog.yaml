surfaces:
  - id: fourmeme.ui
    kind: local_web_ui
    capability: false
    status: experimental
    summary: Local read-only Four.meme token list and detail page.
    transports: [cli]
    chains: [bsc]
    docs: docs/capabilities/fourmeme/README.md

workflows:
  - id: swap
    summary: Quote, build, inspect, and execute a swap.
    status: experimental
    chains: [ethereum]
    steps:
      - swap.quote
      - swap.build
      - wallet.allowance
      - transaction.simulate
      - transaction.inspect
      - transaction.send
      - transaction.verify
    planned_steps:
      - swap.execute
    skill: skills/swap/SKILL.md
    docs: docs/feature/v3/capability-runtime/workflows.md
    gaps:
      - swap.build supports one Uniswap V2 allocation only
      - approvals are documented but not a shared helper

  - id: yield-deposit
    summary: Discover a curated yield opportunity, deposit, and analyze the position.
    status: experimental
    chains: [ethereum]
    steps:
      - yield.discover
      - yield.build
      - wallet.allowance
      - transaction.inspect
      - transaction.simulate
      - transaction.send
      - transaction.verify
      - position.analyze
    planned_steps: []
    skill: skills/yield/SKILL.md
    docs: docs/feature/v3/capability-runtime/workflows.md
    gaps:
      - approval sequencing is not a shared helper
      - position.analyze should use the post-execution block

  - id: fourmeme-discovery
    summary: Discover Four.meme Agent ID tokens and check wallet eligibility.
    status: experimental
    chains: [bsc]
    steps:
      - fourmeme.agent-tokens
      - fourmeme.token
      - wallet.agent-id
    planned_steps: []
    skill: skills/fourmeme/SKILL.md
    docs: docs/feature/v3/capability-runtime/workflows.md
    gaps:
      - discovery is bounded by lookback-blocks
      - eligibility is unknown when AgentIdentifier is unavailable

  - id: portfolio
    summary: Summarize wallet holdings and curated yield positions.
    status: experimental
    chains: [ethereum]
    steps:
      - wallet.balance
      - wallet.assets
      - wallet.collectibles
      - position.analyze
    planned_steps: []
    skill: skills/wallet/SKILL.md
    docs: docs/feature/v3/capability-runtime/workflows.md
    gaps:
      - position.analyze is Ethereum-only
      - BSC portfolio excludes the position step
