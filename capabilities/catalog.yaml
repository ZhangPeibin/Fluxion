version: 2
updated: "2026-11-22"
envelope: v1

capabilities:
  - id: swap.quote
    domain: swap
    action: quote
    status: stable
    summary: Exact-in swap quote on Ethereum.
    envelope: v2
    execution: remote
    transports: [mcp, cli, http]
    chains: [ethereum]
    default_chain: ethereum
    side_effects: read_only
    requires: []
    schema: schemas/swap_quote.v2.json
    skill: skills/swap/SKILL.md
    docs: docs/capabilities/swap/README.md
    tests:
      - crates/client/tests/client_remote.rs
      - tests/integration_mainnet.rs
      - tests/split_quotes.rs
    workflows: [swap]
    coverage_dimensions: [data, freshness]

  - id: swap.build
    domain: swap
    action: build
    status: stable
    summary: Build V2 swap calldata from a quote.
    envelope: v2
    execution: local
    transports: [mcp, cli]
    chains: [ethereum]
    default_chain: ethereum
    side_effects: prepares_calldata
    requires: [swap.quote]
    schema: schemas/swap_build.v2.json
    skill: skills/swap/SKILL.md
    docs: docs/capabilities/swap/README.md
    tests:
      - crates/client/src/swap_build.rs
    workflows: [swap]
    coverage_dimensions: [data]

