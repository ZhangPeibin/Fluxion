# Fluxion configuration example. Copy to `config.yaml` and adjust.
# Missing keys fall back to the defaults shown here. Unknown keys are rejected.

# HTTP server bind address.
host: "127.0.0.1"
port: 8080

# Third-party RPC endpoint (not secret).
rpc_url: "https://eth.drpc.org"

# Official Graph decentralized-network subgraph IDs.
uniswap_v2_subgraph_id: "EYCKATKGBKLWvSfwvBjzfCBmGwYNdVkduYXVivCsLRFu"
uniswap_v3_subgraph_id: "5zvR82QoaXYFyDEKLZ9t6v9adgnptxYpKpSbxtgVENFV"

# Curve AddressProvider; the registry is resolved from it.
curve_address_provider: "0x0000000022D53366457F9d5E68Ec105046FC4383"
# Registry ids to enumerate: 0 = main stableswap, 5 = crypto (tricrypto).
# 7 = MetaRegistry (all pools incl. factory/metapool) is opt-in; it is much
# slower and only adds pools if the token allowlist admits them (factory /
# metapool pools rarely have all-major coins).
curve_registry_ids: [0, 5]

# Platforms to consider.
enabled_platforms:
  - uniswap-v2
  - uniswap-v3
  - curve
  - shibaswap-v2

# ShibaSwap V2: factory getPair for both-allowlisted token pairs (30 bps fee).
# Liquidity uses reserve-ratio estimates anchored in USDC/USDT/DAI and WETH.
# Pools without a USD anchor are excluded when min_liquidity > 0.
# Factory discovery cannot apply volume/age filters: nonzero values disable it with a warning.
shibaswap_v2_factory: "0x115934131916C8b277DD010Ee02de363c09d037c"

# Same-interface deployments, config-only. Each V2 fork is discovered through
# its getPair factory; set shibaswap: true only for the ShibaSwap math variant.
v2_forks: []
#  - name: my-v2-fork
#    factory: "0x..."
#    shibaswap: false

# Additional V3-compatible deployments, discovered through their own subgraph.
v3_subgraphs: []
#  - name: my-v3-fork
#    subgraph_id: "..."

# Typed protocol conversion instances. [] disables all conversions.
# This is a live protocol exchange rate, not a fixed 1:1 or a static config rate.
# wrap/unwrap are independently configurable; each operation counts as one hop.
protocol_conversions:
  - kind: wsteth
    contract: "0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0"
    underlying: "0xae7ab96520de3a18e5e111b5eaab095312d7fe84"
    wrapped: "0x7f39c581f595b53c5cb19bd0b3f8da6c935e2ca0"
    enabled: true
    wrap: true
    unwrap: true

# Routing.
max_hops: 3          # max edges in a route
top_k: 8             # candidates per (token, hop, capability family); at most 4 families
max_pools: 10000     # cap discovered pools per platform (top by liquidity/volume)
slippage_penalty_lambda: 0.0   # liquidity penalty coefficient

# Pool filtering.
min_liquidity: 10000       # static lower bound (USD-ish); lower = more pools/tokens
min_volume_24h: 0          # 24h volume floor
min_pool_age_days: 0       # minimum pool age in days
reserve_ratio_k: 0         # skip edges where reserve_in < k * amount_in (0 = off)
# Optional token allowlist. Empty = built-in major-token list.
# Listing addresses restricts V2/V3 pools to pairs where BOTH coins are listed
# and Curve pools where ALL coins are listed.
token_allowlist: []

# State refresh (hot-pool set) and mid-price cache TTL.
refresh_interval_secs: 30
# Full price-snapshot rebuild interval. Keep this well above the rebuild cost.
snapshot_refresh_secs: 120
# Re-run pool discovery while serving; new pools are queued add-only. 0 disables.
universe_refresh_secs: 300

# Per-request timeout for /quote (milliseconds).
request_timeout_ms: 10000

# Migration opt-in: rpc (existing full-venue behavior) or local_snapshot.
# Local mode supports V2/ShibaSwap, covered V3, Lido v4, three Curve stable pools and Tricrypto2.
# Other Curve deployments/protocol versions are explicit, never silently dropped.
# See tests/configs/v2.yaml, tests/configs/v3.yaml,
# or tests/configs/wsteth.yaml.
# The explicit 3pool HTTP demo uses: cargo run --example local_curve_server
# For Tricrypto2: --tricrypto2 --config tests/configs/tricrypto2.yaml
# Add --all-stable --config tests/configs/curve-stable.yaml for all three verified stable pools.
# Combine --all-stable and --tricrypto2 for all four verified Curve deployments.
pricing_mode: rpc
# Explicit deployment exclusions (addresses), also reported in /info.config.
# See bench/configs/local.yaml for the legacy Tricrypto exclusion.
excluded_pools: []
local_state:
  poll_interval_ms: 2000
  sync_timeout_ms: 30000
  batch_size: 200
  max_age_secs: 60 # block age, not time since the last successful poll
  max_lag_blocks: 3 # relative to the most recently observed head
  v3_bitmap_radius: 2 # center word +/- radius; missing coverage fails explicitly
  v3_full_range: false # opt-in full global bitmap/ticks; higher sync cost, ignores radius
  v3_max_loaded_ticks: 50000 # total across the snapshot; no silent truncation
  compute_concurrency: 4 # CPU workers; saturation returns 429, not an unbounded queue
  sync_mode: incremental # full | incremental; full reloads still reconcile on reorg/gap
  full_reload_interval_secs: 900 # periodic reconciliation with a complete rebuild
  max_incremental_gap_blocks: 64 # larger gaps rebuild instead of chasing logs
  v3_log_chunk_blocks: 5000 # inclusive eth_getLogs range while catching up

# Opt-in HTTP split=true. Existing requests remain single-route.
# A request may lower split_max_branches to 2, not exceed this server cap.
split:
  max_branches: 4
  max_pools: 4
  allocation_segments: 20
  coarse_segments: 10
  refinement_segments: 4
  refinement_rounds: 2
  max_quote_calls: 256
  concurrency: 8
  timeout_ms: 8000 # additionally bounded by the HTTP request's remaining time
