# #31 stage 1 demonstration, NOT the full-venue quote-quality profile.
# Uses real ShibaSwap V2 discovery without a Graph key. To add Uniswap V2,
# add uniswap-v2 to enabled_platforms and supply GRAPH_API_KEY via .env.
host: 127.0.0.1
port: 8083
pricing_mode: local_snapshot
enabled_platforms: [shibaswap-v2]
protocol_conversions: []
token_allowlist:
  - "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2" # WETH
  - "0x95aD61b0a150d79219dCF64E1E6Cc01f0B64C4cE" # SHIB
local_state:
  poll_interval_ms: 2000
  sync_timeout_ms: 30000
  batch_size: 200
  max_age_secs: 60
  max_lag_blocks: 3
